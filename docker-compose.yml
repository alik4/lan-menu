services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: menuapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: menuapp
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build:
      context: ./app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://menuapp:${POSTGRES_PASSWORD:-changeme}@db:5432/menuapp
      JWT_SECRET: ${JWT_SECRET:-change-this-to-something-long-and-random}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads

volumes:
  db-data:
  uploads:
